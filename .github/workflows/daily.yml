name: Research the daily edition
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC edition date YYYY-MM-DD; blank = yesterday'
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: archive-daily
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select edition date
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {validDay} from "./lib/validate.mjs"; const d=process.env.REQUESTED_DATE||new Date(Date.now()-86400000).toISOString().slice(0,10); if(!validDay(d))throw Error("Invalid date"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`date=${d}\n`);'
      - name: Research and verify all sources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          EDITION_DATE: ${{ steps.date.outputs.date }}
        run: node scripts/research.mjs "$EDITION_DATE"
      - name: Admit verified draft
        env:
          EDITION_DATE: ${{ steps.date.outputs.date }}
        run: |
          if [ -f "work/drafts/$EDITION_DATE.json" ]; then
            node scripts/publish.mjs "work/drafts/$EDITION_DATE.json"
          fi
          npm test
          npm run validate
          npm run build
      - name: Commit or open review request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ steps.date.outputs.date }}
          PUBLISH_MODE: ${{ vars.ARCHIVE_PUBLISH_MODE }}
        run: |
          git config user.name 'World News Archive bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/editions
          if git diff --cached --quiet; then
            echo 'Edition already exists; no change.'
            exit 0
          fi
          node scripts/mark-configured.mjs
          git add config.json
          if [ "$PUBLISH_MODE" = 'review' ]; then
            BRANCH="editions/$EDITION_DATE"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo 'Review branch already exists; preserving it.'
              exit 0
            fi
            git switch -c "$BRANCH"
            git commit -m "Archive edition $EDITION_DATE"
            git push origin "$BRANCH"
            cat > work/review-body.md <<'BODY'
          A researched edition with three stories and nine verified source links is ready for editorial review. Inspect dates, claims, source independence, substantial contrast and uncertainty. The draft passed source retrieval and a separate automated evidence review; this is not human verification. Merge to publish, or edit by following the correction guide.
          BODY
            gh pr create --base main --head "$BRANCH" --title "Review edition $EDITION_DATE" --body-file work/review-body.md
          else
            git commit -m "Archive edition $EDITION_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Keep verification receipt and recoverable draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ steps.date.outputs.date }}
          path: work/drafts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Record unsuccessful run
        if: failure()
        run: echo 'Research or verification failed. The previous published archive is preserved. Inspect the failed step; do not weaken evidence checks just to fill a missing day.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: needs.enrich.outputs.published == 'true'
    needs: enrich
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
