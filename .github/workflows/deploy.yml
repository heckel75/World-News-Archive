name: Validate and deploy archive
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run validate
      - name: Preserve published versions
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-immutability.mjs "$BASE"
      - run: npm run build
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
